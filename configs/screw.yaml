port: 2355
save_video: true
seed: 42 # seed 42

PipelineParams:
  convert_SHs_python: True # true = using direct rgb

ModelParams:
  workspace: screw_cvpr_re_4_check
  sh_degree: 0
  bg_aug_ratio: 0.5

GuidanceParams:
  model_key: 'stabilityai/stable-diffusion-2-1-base'
  text: 'A highly detailed, industrial-grade metallic <screw> with realistic threading, sharp ridges, and a polished steel surface. Studio lighting, isolated on a plain background.'
  # Replace <YYYYMMDD_HHMMSS> with the actual timestamp from your distill_lora.sh run
  LoRA_path: "lora_train/multi_combine_<YYYYMMDD_HHMMSS>/multi_teacher_distilled/final_multi_teacher_hybrid_lora_step_5000.safetensors"
  # LoRA_path: "lora_train/multi_combine_<YYYYMMDD_HHMMSS>/multi_teacher_distilled/final_step_inv_multi_teacher_hybrid_5000.safetensors"
  negative: 'unrealistic, blurry, low quality, out of focus, rusty, damaged, misaligned shape, sharp tip, oversaturation.'
  inverse_text: ''
  perpneg: true
  C_batch_size: 4  # changed to 6
  t_range: [0.02, 0.5]
  max_t_range: 0.98
  lambda_guidance: 0.15
  guidance_scale: 7.5
  denoise_guidance_scale: 1.2
  noise_seed: 0
  sd_loss_weight1: 0.1
  sd_matching_iter: 1500
  sd_loss_weight2: 1

  # hypergraph usage
  use_dhg_latent_hypergraph: true

  # log path
  tensorboard_log_dir: "runs/sd_training_cvprre"
  
  # edge-guided loss parameters
  edge_loss_weight: 1                 # edge-guided loss weight
  edge_warmup_iters: 500                # warmup iterations for edge-guided loss

  ddim_inv: true
  annealing_intervals: true
  fixed_view: true  # fixed viewpoint

  xs_delta_t: 200
  xs_inv_steps: 5
  xs_eta: 0.0
  
  delta_t: 80
  delta_t_start: 100

GenerateCamParams:
  init_shape: 'pointe'
  init_prompt: 'a thin rod'
  use_pointe_rgb: false
  init_num_pts: 100_000
  
  # 🔥 Horizontal angle: full rotation to observe threading
  phi_range: [-180, 180]
  max_phi_range: [-180, 180]
  rand_cam_gamma: 1.2  # decreased to make viewpoint distribution more uniform
  
  # 🔥 Key: vertical angle biased toward front-view and top-view
  theta_range: [45, 105]
  max_theta_range: [45, 105]

  radius_range: [4.5, 6.5]
  max_radius_range: [4.5, 6.5]
  default_radius: 4.8
  
  default_fovy: 0.55
  fovy_range: [0.35, 0.65]
  max_fovy_range: [0.25, 0.65]

OptimizationParams:
  iterations: 5000
  save_process: True
  pro_frames_num: 600
  pro_render_45: False
  warmup_iter: 1500 # 2500

  as_latent_ratio: 0.25
  geo_iter: 0
  densify_from_iter: 100  # start early to accelerate density optimization
  densify_until_iter: 3000
  percent_dense: 0.005
  densify_grad_threshold: 0.00075
  progressive_view_iter: 500
  opacity_reset_interval: 300  # moderately increased to optimize opacity

  scale_up_cameras_iter: 500
  fovy_scale_up_factor: [0.75, 1.1]
  phi_scale_up_factor: 1.5
  
  # viewpoint_mode: 'six_view'
  save_sd_images: False  # enable SD reference image saving
  # use_control_net_iter: 10
