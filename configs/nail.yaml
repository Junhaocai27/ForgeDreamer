port: 2355
save_video: true
seed: 42

PipelineParams:
  convert_SHs_python: True

ModelParams:
  workspace: nail_new_ex_test2
  sh_degree: 0
  bg_aug_ratio: 0.5

GuidanceParams:
  model_key: 'stabilityai/stable-diffusion-2-1-base'
  text: 'A professional close-up photograph of a precision-manufactured <nail> with smooth cylindrical shank, flat circular head, and sharp tapered point. Polished steel construction with slight metallic sheen, high-quality hardware fastener. Studio lighting highlighting the metallic texture and form against neutral background.'
  # Update this path to one of your available distilled LoRA weights.
  LoRA_path: "lora_train/multi_combine_<YYYYMMDD_HHMMSS>/multi_teacher_distilled/final_multi_teacher_hybrid_lora_step_5000.safetensors"
  negative: 'unrealistic, blurry, low quality, out of focus, rusty, damaged, misaligned shape, sharp tip, oversaturation.'
  inverse_text: ''
  perpneg: true
  C_batch_size: 4
  t_range: [0.02, 0.5]
  max_t_range: 0.98
  lambda_guidance: 0.15
  guidance_scale: 7.5
  denoise_guidance_scale: 1.2
  noise_seed: 0
  sd_loss_weight1: 0.1
  sd_matching_iter: 1500
  sd_loss_weight2: 1

  use_dhg_latent_hypergraph: true

  tensorboard_log_dir: "/root/LucidDreamer/runs/sd_training_new7"
  
  edge_loss_weight: 1
  edge_warmup_iters: 500

  ddim_inv: true
  annealing_intervals: true
  fixed_view: true

  xs_delta_t: 200
  xs_inv_steps: 5
  xs_eta: 0.0
  
  delta_t: 80
  delta_t_start: 100

GenerateCamParams:
  init_shape: 'pointe'
  init_prompt: 'a thin rod'
  use_pointe_rgb: false
  init_num_pts: 100_000
  
  phi_range: [-180, 180]
  max_phi_range: [-180, 180]
  rand_cam_gamma: 1.2
  
  theta_range: [45, 105]
  max_theta_range: [45, 105]

  radius_range: [4.5, 6.5]
  max_radius_range: [4.5, 6.5]
  default_radius: 4.8
  
  default_fovy: 0.55
  fovy_range: [0.35, 0.65]
  max_fovy_range: [0.25, 0.65]

OptimizationParams:
  iterations: 5000
  save_process: True
  pro_frames_num: 600
  pro_render_45: False
  warmup_iter: 1500

  as_latent_ratio: 0.25
  geo_iter: 0
  densify_from_iter: 100
  densify_until_iter: 3000
  percent_dense: 0.005
  densify_grad_threshold: 0.00075
  progressive_view_iter: 500
  opacity_reset_interval: 300

  scale_up_cameras_iter: 500
  fovy_scale_up_factor: [0.75, 1.1]
  phi_scale_up_factor: 1.5
  
  save_sd_images: False
