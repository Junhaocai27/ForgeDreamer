port: 2355
save_video: true
seed: 42 # 种子42

PipelineParams:
  convert_SHs_python: True # true = using direct rgb

ModelParams:
  workspace: nail_bishe
  sh_degree: 0
  bg_aug_ratio: 0.5

GuidanceParams:
  model_key: 'stabilityai/stable-diffusion-2-1-base'
  text: 'highly detailed <nail>, industrial grade steel, flat head, precise shaft, sharp pointed tip, mechanical engineering part, matte surface with subtle scratches, ultra-realistic, 8k resolution, professional photography, industrial catalog, no ambient light, slender'
  LoRA_path: "/home/s414e2/CJH/Text-to-3D/LucidDreamer/custom_example/nail_new/step_inv_1000.safetensors"
  negative: 'unrealistic, blurry, low quality, out of focus, rusty, damaged, misaligned shape, oversaturation.'
  inverse_text: ''
  perpneg: true
  C_batch_size: 4  # 修改为6
  t_range: [0.02, 0.5]
  max_t_range: 0.98
  lambda_guidance: 0.15
  guidance_scale: 7.5
  denoise_guidance_scale: 1.2
  noise_seed: 0
  sd_loss_weight1: 0.1
  sd_matching_iter: 1500
  sd_loss_weight2: 1

  # 超图一致性损失参数
  hypergraph_consistency_weight: 1    # 超图一致性损失权重
  hypergraph_warmup_iters: 100         # 超图一致性损失预热迭代次数
  
  # 边缘引导损失参数
  edge_loss_weight: 1                 # 边缘引导损失权重
  edge_warmup_iters: 500                # 边缘引导损失预热迭代次数

  ddim_inv: true
  annealing_intervals: true

  xs_delta_t: 200
  xs_inv_steps: 5
  xs_eta: 0.0
  
  delta_t: 80
  delta_t_start: 100

GenerateCamParams:
  init_shape: 'pointe'  # 如果支持，改为 'flat_top'
  # use_image: true
  init_prompt: 'a nail'  # 修改为 nail
  use_pointe_rgb: false
  init_num_pts: 100_000
  phi_range: [-180, 180]
  max_phi_range: [-180, 180]
  rand_cam_gamma: 1.5

  theta_range: [45, 105]
  max_theta_range: [45, 105]

  radius_range: [4.5, 6.5]
  max_radius_range: [4.5, 6.5]
  default_radius: 4.8
 
  default_fovy: 0.55
  fovy_range: [0.35, 0.65]
  max_fovy_range: [0.25, 0.65]

OptimizationParams:
  iterations: 5000
  save_process: True
  pro_frames_num: 600
  pro_render_45: False
  warmup_iter: 1500 # 2500

  as_latent_ratio: 0.25
  geo_iter: 0
  densify_from_iter: 100  # 提前加快密度优化
  densify_until_iter: 3000
  percent_dense: 0.005
  densify_grad_threshold: 0.00075
  progressive_view_iter: 500
  opacity_reset_interval: 300  # 适当增加，优化透明度

  scale_up_cameras_iter: 500
  fovy_scale_up_factor: [0.75, 1.1]
  phi_scale_up_factor: 1.5
  
  # viewpoint_mode: 'six_view'
  save_sd_images: False  # 启用SD参考图像保存
  # use_control_net_iter: 10
