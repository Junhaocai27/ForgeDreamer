port: 2355
save_video: true
seed: 42  # 优化随机种子

PipelineParams:
  convert_SHs_python: False

ModelParams:
  workspace: cable_gland_v0_cylinder  # 保持用户设定
  sh_degree: 1  # 增强材质表现
  bg_aug_ratio: 0.3  # 降低背景干扰

GuidanceParams:
  model_key: 'stabilityai/stable-diffusion-2-1-base'
  text: '<cable_gland>, metallic surface, industrial details, studio lighting'  # 增强描述
  LoRA_path: "/home/s414e2/CJH/Text-to-3D/LucidDreamer/custom_example/cable_gland/step_inv_1000.safetensors"
  negative: 'unrealistic, blurry, low quality, out of focus, rusty, damaged, low-resolution, oversaturation.'
  inverse_text: ''
  perpneg: false  # 启用原有参数
  C_batch_size: 4  # 提升批次稳定性
  t_range: [0.02, 0.45]  # 优化噪声调度
  max_t_range: 0.95
  lambda_guidance: 0.12
  guidance_scale: 9.0  # 增强引导强度
  denoise_guidance_scale: 1.1
  noise_seed: 42

  ddim_inv: true
  annealing_intervals: true

  xs_delta_t: 250  # 优化交叉阶段
  xs_inv_steps: 8
  xs_eta: 0.02
  
  delta_t: 100
  delta_t_start: 120

GenerateCamParams:
  init_shape: 'pointe'  # 保持用户设定
  init_prompt: 'cylinder'  # 更相关初始化
  use_pointe_rgb: false
  init_num_pts: 120_000  # 增加初始点
  
  phi_range: [-200, 200]  # 扩展视角范围
  max_phi_range: [-220, 220]
  
  theta_range: [40, 110]
  max_theta_range: [35, 115]

  radius_range: [4.8, 5.2]  # 优化观测距离
  max_radius_range: [4.3, 6.0]
  default_radius: 4.6
 
  default_fovy: 0.5  # 微调视场角
  fovy_range: [0.4, 0.6]
  max_fovy_range: [0.3, 0.65]

OptimizationParams:
  iterations: 5000  # 延长训练
  save_process: True
  pro_frames_num: 600
  pro_render_45: False
  
  as_latent_ratio: 0.3  # 平衡潜在空间
  geo_iter: 200  # 提前几何优化
  densify_from_iter: 50  # 更早开始密集化
  densify_until_iter: 4000
  percent_dense: 0.006
  densify_grad_threshold: 0.0006
  progressive_view_iter: 400  # 优化视角渐进
  opacity_reset_interval: 400

  scale_up_cameras_iter: 400
  fovy_scale_up_factor: [0.8, 1.2]
  phi_scale_up_factor: 1.6