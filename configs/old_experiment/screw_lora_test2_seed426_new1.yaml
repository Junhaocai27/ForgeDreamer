port: 2355
save_video: true
seed: 42 # 种子42

PipelineParams:
  convert_SHs_python: False # true = using direct rgb

ModelParams:
  workspace: screw_lora_test2_426_lora_5000_1
  sh_degree: 0
  bg_aug_ratio: 0.5

GuidanceParams:
  model_key: 'stabilityai/stable-diffusion-2-1-base'
  text: 'A DSLR photo of a flat-top Phillips metal <screw> with a flush circular head surface, continuous parallel threads, polished precision-machined geometry, and no nut attached.'
  LoRA_path: "/home/s414e2/CJH/Text-to-3D/LucidDreamer/custom_example/screw/step_inv_1000.safetensors"
  negative: 'unrealistic, blurry, low quality, out of focus, rusty, damaged, misaligned shape, sharp tip, oversaturation.'
  inverse_text: ''
  perpneg: false
  C_batch_size: 6  # 修改为6
  t_range: [0.02, 0.5]
  max_t_range: 0.98
  lambda_guidance: 0.15
  guidance_scale: 7.5
  denoise_guidance_scale: 1.2
  noise_seed: 0

  ddim_inv: true
  annealing_intervals: true

  xs_delta_t: 200
  xs_inv_steps: 5
  xs_eta: 0.0
  
  delta_t: 80
  delta_t_start: 100

GenerateCamParams:
  init_shape: 'pointe'  # 如果支持，改为 'flat_top'
  init_prompt: 'a pencil.'  # 修改为screw
  use_pointe_rgb: false
  init_num_pts: 100_000
  phi_range: [-180, 180]
  max_phi_range: [-180, 180]
  rand_cam_gamma: 1.

  theta_range: [45, 105]
  max_theta_range: [45, 105]

  radius_range: [5.0, 6.0]
  max_radius_range: [4.5, 6.5]
  default_radius: 4.8
 
  default_fovy: 0.55
  fovy_range: [0.35, 0.65]
  max_fovy_range: [0.25, 0.65]

OptimizationParams:
  iterations: 10000
  save_process: True
  pro_frames_num: 600
  pro_render_45: False
  warmup_iter: 1500 # 2500

  as_latent_ratio: 0.25
  geo_iter: 0
  densify_from_iter: 100  # 提前加快密度优化
  densify_until_iter: 3000
  percent_dense: 0.005
  densify_grad_threshold: 0.00075
  progressive_view_iter: 500
  opacity_reset_interval: 300  # 适当增加，优化透明度

  scale_up_cameras_iter: 500
  fovy_scale_up_factor: [0.75, 1.1]
  phi_scale_up_factor: 1.5
